apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi  # Make sure this matches the PV's capacity
  #volumeName: postgres-pv  # Explicitly bind to the existing PV
  #storageClassName: standard  # Ensure this matches the PV's StorageClass